{{/* lp_head / lp_foot bracket a list pane; the page fills the rows between. */}}
{{define "lp_head"}}
<aside class="listpane">
  <div class="lp-h">
    <span class="l">{{icon .Glyph}} {{.Label}}</span>
    {{if .NewURL}}<a class="new-link" href="{{.NewURL}}">{{icon "plus"}} New</a>{{end}}
  </div>
  <label class="filter">{{icon "search"}}<input type="text" placeholder="Filter…" x-data x-model="$store.filter.q" spellcheck="false"></label>
  <div class="lp-scroll">
{{end}}
{{define "lp_foot"}}
  </div>
  <div class="lp-f"><span class="kbd">j</span><span class="kbd">k</span> move · <span class="kbd">c</span> new · <span class="kbd">/</span> filter</div>
</aside>
{{end}}
