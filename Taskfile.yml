# Taskfile for doze-kafka. Run with `go tool task <name>` (task is a go tool
# dependency, so no separate install is needed). `go tool task --list` shows all.
#
# Every go command runs with GOWORK=off (set globally below) so a go.work in some
# parent directory can never change what is built or tested here.
version: '3'

env:
  GOWORK: off

vars:
  BINARY: doze-kafka

tasks:
  default:
    desc: List available tasks
    cmds:
      - go tool task --list
    silent: true

  build:
    desc: Build the broker binary into bin/
    cmds:
      - go build -o bin/{{.BINARY}} ./cmd/doze-kafka

  run:
    desc: 'Build and run the broker (zero config: kafka.<dir>.doze:9092, console at http://kafka.<dir>.doze)'
    deps: [build]
    cmds:
      - ./bin/{{.BINARY}}

  dev:
    desc: 'Run the broker with the console read live from disk: edit console/templates or console/static and reload'
    cmds:
      - DOZE_KAFKA_CONSOLE_DEV=./console go run ./cmd/doze-kafka --listen 127.0.0.1:9092 {{.CLI_ARGS}}

  test:
    desc: Run the whole test suite (unit + integration)
    cmds:
      - go test ./...

  test:unit:
    desc: The quick pass (-short) — skips most tests that boot a broker
    cmds:
      - go test -short ./...

  test:integration:
    desc: Integration tests — a real broker driven over a socket by real clients
    cmds:
      - go test ./internal/broker/...

  test:race:
    desc: Run the whole suite with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  check:
    desc: 'Pre-push gate: gofmt check, go vet, Windows cross-vet, and the full race suite. Wire it as a git pre-push hook (task hooks:install).'
    cmds:
      # Tracked and new files only: scratch worktrees and vendored trees are not ours to format.
      - 'files=$(git ls-files --cached --others --exclude-standard -- "*.go"); test -z "$(gofmt -l $files)" || { echo "gofmt needed:"; gofmt -l $files; exit 1; }'
      - go vet ./...
      # Windows ships in the release and nobody here runs it; this at least proves it compiles.
      - GOOS=windows GOARCH=amd64 go vet ./...
      - go test -race ./...
      # Every benchmark once: one that no longer runs (BenchmarkInitProducerID sent a body
      # its handler could not decode, and nobody noticed) fails here, not when somebody
      # next wants a number from it.
      - task: bench:smoke
      # The fault seam (internal/faultinject) exists only behind its tag, so its tests only run with it.
      - go test -tags faultinject ./internal/faultinject/ ./internal/storage/... ./internal/broker/ -run 'FaultSeam|^Test(Parse|HitAfterAndClear|Delay|FileIsRead)'

  vuln:
    desc: 'govulncheck over this module and module/: fails on any reachable vulnerability not accepted, with its guarding test, in testdata/vulncheck-accepted.txt. Needs the network (vuln.go.dev), so it is its own workflow and not part of check'
    cmds:
      - go run ./scripts/vulncheck . module

  bench:smoke:
    desc: 'Run every benchmark for one iteration, so a benchmark that has stopped working fails the gate'
    cmds:
      - go test -run '^$' -bench . -benchtime=1x ./...

  hooks:install:
    desc: Install a git pre-push hook that runs `task check`.
    cmds:
      - mkdir -p .git/hooks
      - printf '#!/bin/sh\nexec go tool task check\n' > .git/hooks/pre-push
      - chmod +x .git/hooks/pre-push
      - echo 'installed .git/hooks/pre-push -> task check'

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  test:e2e:
    desc: 'The console in a real browser (Playwright): builds the binary, boots it on its own ports over a fresh data dir, seeds it'
    dir: e2e
    cmds:
      - bun install --frozen-lockfile
      - bunx playwright install chromium
      - bunx playwright test

  evidence:
    desc: 'Design evidence: screenshots of the live console at each board state (light, dark; 1440, and 960/390 where a board has one) into plan/evidence/, with the index. DESIGN_DIR=<the design artifact''s project/ files> also renders the boards. Not part of test:e2e.'
    dir: e2e
    cmds:
      - bun install --frozen-lockfile
      - bunx playwright install chromium
      - bunx playwright test -c evidence/playwright.config.ts
      - python3 evidence/optimise.py ../plan/evidence

  check:identity:
    desc: 'The second identity (listener on :0, a console prefix, a data directory with a space, SASL and TLS on) booted as the binary and used by a real client and the console'
    cmds:
      - go test -race -count=1 -run 'SecondIdentity' ./cmd/doze-kafka

  test:e2e:identity:
    desc: 'The browser suite against a broker started with the second identity (listener on 127.0.0.1:0, console prefix, data dir with a space, SASL and TLS); the route gate is on'
    cmds:
      - go build -o bin/{{.BINARY}} ./cmd/doze-kafka
      - cd e2e && bun install --frozen-lockfile && bunx playwright install chromium
      - go run ./e2e/identity -bin bin/{{.BINARY}} -- sh -c 'cd e2e && bunx playwright test'

  test:identity:
    desc: 'The console and browser suites with nothing tidy about the broker: the console under /ops/kafka-ui, a data directory with a space, the listener on 127.0.0.1:0 (browser), DOZE_ZONE=off. The run with the name zone on needs the doze-names daemon and is local only.'
    cmds:
      - DOZE_ZONE=off DOZE_KAFKA_CONSOLE_PREFIX=/ops/kafka-ui go test -count=1 ./console
      - cd e2e && bun install --frozen-lockfile && bunx playwright install chromium && E2E_IDENTITY=1 bunx playwright test

  test:compat:
    desc: 'Real clients and frameworks against the binary (compat/): Java, Streams, Spring, Python, KafkaJS, kcat. Needs Docker for the JVM ones; missing toolchains are SKIPPED, not passed. Name clients to run only those: task test:compat -- java python'
    cmds:
      - compat/run.sh {{.CLI_ARGS}}

  conformance:
    desc: 'Replay the recorded Apache Kafka scenarios (conformance/recordings) against doze-kafka; no Docker'
    cmds:
      - go test ./conformance -count=1 -v -run 'TestReplay|TestKnown'

  conformance:record:
    desc: 'Record the scenarios against apache/kafka:4.3.1 in Docker and rewrite conformance/recordings. One scenario: task conformance:record -- -only=listoffsets'
    cmds:
      - go test ./conformance -count=1 -v -run TestRecord -record {{.CLI_ARGS}}

  conformance:stable:
    desc: 'Record every scripted scenario against apache/kafka:4.3.1 three times and fail unless each run is byte-identical to the committed recordings (a timing-dependent step shows as a changed file). Needs Docker and a clean conformance/recordings'
    cmds:
      - scripts/conformance-stable.sh

  test:kcat:
    desc: 'kcat (librdkafka) against the real binary; needs kcat installed'
    cmds:
      - go build -o bin/doze-kafka ./cmd/doze-kafka
      - scripts/kcat-check.sh bin/doze-kafka

  coverage:
    desc: 'Statement coverage per package against the committed floor (testdata/coverage.txt); fails if one fell by more than 0.1 point'
    cmds:
      - scripts/coverage.sh

  coverage:record:
    desc: 'Raise the coverage floor to the current numbers (never lowers one unless ALLOW_LOWER=1)'
    cmds:
      - scripts/coverage.sh record

  lightness:
    desc: 'Binary size, idle heap and module count against testdata/lightness.json (5% slack)'
    cmds:
      - scripts/lightness.sh

  lightness:record:
    desc: 'Record today''s weight as the budget (the commit message says why it grew)'
    cmds:
      - scripts/lightness.sh record

  mutate:record:
    desc: 'Mutation-test packages (gremlins, a go tool) and store counts and surviving mutants as file:line:type in testdata/mutation.json. Name packages: task mutate:record -- ./internal/protocol'
    cmds:
      - go run ./scripts/mutate record {{.CLI_ARGS}}

  mutate:check:
    desc: 'Fail on a surviving mutant the baseline (testdata/mutation.json) does not have. No package named runs every unit; internal/broker is four units, split by file group. task mutate:list shows them'
    cmds:
      - go run ./scripts/mutate check {{.CLI_ARGS}}

  mutate:list:
    desc: 'The mutation units (a package, or a file group of one that is too slow to run whole)'
    cmds:
      - go run ./scripts/mutate list

  claims:
    desc: 'Print the number of claims per evidence source (spec, recorded, doc, memory) and check every claims table under conformance/claims/'
    cmds:
      - go test ./conformance -run TestClaimsCountPerSource -v -count=1

  api:
    desc: 'The exported surface of server/ (the embedding API) against testdata/api/server.txt; a change needs a CHANGELOG.md line containing "server API"'
    cmds:
      - scripts/api.sh

  api:record:
    desc: 'Write the exported surface of server/ to testdata/api/server.txt (add the CHANGELOG.md line in the same commit)'
    cmds:
      - scripts/api.sh record

  fuzz:
    desc: 'Fuzz every parser of untrusted bytes (testdata/fuzz-targets.txt, listed in docs/architecture.md), each for FUZZ_TIME (default 30s). Name some to run only those: task fuzz -- Scram'
    vars:
      FUZZ_TIME: '{{.FUZZ_TIME | default "30s"}}'
    cmds:
      # One target per run: go test refuses -fuzz when it matches more than one.
      - scripts/fuzz.sh {{.FUZZ_TIME}} {{.CLI_ARGS | default "."}}

  soak:
    desc: 'Leak-detection soak: sustained load, no faults (SOAK_DURATION, default 2m)'
    env:
      SOAK_CHAOS: '0'
      SOAK_DURATION: '{{.SOAK_DURATION | default "2m"}}'
    cmds:
      - go test -run TestSoak -timeout 24h -v ./internal/broker/

  chaos:
    desc: 'Chaos soak: kill/restart the broker under load (SOAK_DURATION, default 2m)'
    env:
      SOAK_CHAOS: '1'
      SOAK_DURATION: '{{.SOAK_DURATION | default "2m"}}'
    cmds:
      - go test -run TestSoak -timeout 24h -v ./internal/broker/

  clean:
    desc: Remove build output and local broker data
    cmds:
      # The metadata database lives inside the data directory. (A ./meta.db is
      # from before that, and is removed too.)
      - rm -rf bin data meta.db
