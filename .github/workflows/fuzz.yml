name: Fuzz

# Weekly (and on demand) extended fuzzing of every parser of untrusted bytes: the
# wire protocol, record batches and decompression, SASL messages, ACL filters,
# topic config values, the registry's REST bodies and schema texts, the config file,
# the console's forms. The list is testdata/fuzz-targets.txt (the same one `task
# fuzz` runs); each target gets at least 60 seconds, a job of its own, and on a
# crash its failing input is saved as an artifact so it can be replayed locally.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long each target runs (at least 60s for the weekly run)"
        default: "90s"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          matrix="$(grep -v '^#' testdata/fuzz-targets.txt | grep -v '^$' | jq -Rsc 'split("\n") | map(select(length > 0) | split(" ") | {pkg: .[0], target: .[1]})')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.[] | "\(.pkg) \(.target)"'

  fuzz:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime ${{ inputs.fuzztime || '90s' }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/
          if-no-files-found: ignore

  # A scheduled run nobody is watching fails silently: the fuzz job was red for
  # eleven consecutive weeks before anyone looked. Open (or comment on) one issue
  # per workflow so a failure shows up where people already look.
  notify:
    needs: fuzz
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled fuzz run is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The scheduled run failed: $RUN_URL"$'\n\n'"This issue is updated on each failure and can be closed once the workflow is green."
          fi
