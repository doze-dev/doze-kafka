name: Fuzz

# Weekly (and on demand) extended fuzzing of the wire-protocol decoder — the code
# that parses untrusted bytes off the socket. On a crash the failing input is saved
# as an artifact so it can be replayed locally.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseAndDecodeRequest, FuzzSkipTaggedFields, FuzzReadFrame]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }}
        run: go test ./internal/protocol/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: internal/protocol/testdata/fuzz/
          if-no-files-found: ignore

  # A scheduled run nobody is watching fails silently: the fuzz job was red for
  # eleven consecutive weeks before anyone looked. Open (or comment on) one issue
  # per workflow so a failure shows up where people already look.
  notify:
    needs: fuzz
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled fuzz run is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The scheduled run failed: $RUN_URL"$'\n\n'"This issue is updated on each failure and can be closed once the workflow is green."
          fi
