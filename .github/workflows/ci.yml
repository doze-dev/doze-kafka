name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the public-surface rule reads every commit that changed
          # testdata/api/server.txt, and fails in a shallow clone rather than pass on
          # the boundary commit (scripts/api-rule.sh).
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      # The release ships a Windows archive. Vet compiles the tests too, so this
      # is the whole tree, and it is what catches a dependency that stopped
      # building there (as doze-names did) before a tag does.
      - name: go vet (windows, cross-compiled)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: build the binary
        run: go build ./cmd/doze-kafka
      # Every module in the repository, the fixtures of the gates' self-tests included.
      - name: go mod tidy -diff (every module)
        run: |
          for mod in $(git ls-files '*go.mod'); do
            echo "== $mod"; (cd "$(dirname "$mod")" && GOWORK=off go mod tidy -diff) || exit 1
          done
      - name: Public surface (server/)
        run: scripts/api.sh
      # The second identity: listener on :0, a console prefix, a data directory with a
      # space in its name, SASL and TLS all on (foundation B11).
      - name: second identity
        run: go test -race -count=1 -run SecondIdentity ./cmd/doze-kafka

  test:
    strategy:
      fail-fast: false
      matrix:
        # Both OSes: the fsync path differs (macOS uses F_FULLFSYNC).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the coverage gate reads the floor file's history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The documents' kcat commands are run as written (docs/), so kcat is installed.
      - name: Install kcat (Linux; librdkafka 2.15.1 from pinned sources)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libzstd-dev liblz4-dev \
            libssl-dev libsasl2-dev libcurl4-openssl-dev libyajl-dev
          scripts/install-kcat.sh /usr/local
      - name: Install kcat (macOS)
        if: runner.os == 'macOS'
        run: brew install kcat
      - name: Unit tests
        run: go test -short ./...
      - name: Integration tests (race, with coverage)
        run: |
          # The vendored protocol library is generated and mostly unreachable from here:
          # counting it would bury the number that matters.
          go test -race -coverprofile=cover.out -coverpkg="$(go list ./... | grep -v /kmsg | paste -sd, -)" ./...
      - name: Fault seam (build tag faultinject)
        run: go test -tags faultinject ./internal/faultinject/ ./internal/storage/... ./internal/broker/ -run 'FaultSeam|^Test(Parse|HitAfterAndClear|Delay|FileIsRead)'
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "### Coverage"
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo
            # Per package (the mean of its functions), so a package that stopped being covered stands out.
            go tool cover -func=cover.out | awk '$1 !~ /^total/ { split($1, a, "/"); n=split($1, p, "/"); pkg=""; for (i=1;i<n;i++) pkg=pkg (i>1?"/":"") p[i]; sub(/:[0-9]+:.*/, "", pkg); pct=$NF; sub("%","",pct); sum[pkg]+=pct; cnt[pkg]++ } END { for (k in sum) printf "%-60s %5.1f%%\n", k, sum[k]/cnt[k] }' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.out
      # On both: the floors are per platform (testdata/coverage.txt), and macOS runs
      # code Linux does not (F_FULLFSYNC, the doze-names daemon path).
      - name: Coverage floor
        run: scripts/coverage.sh

  # The budget is per platform and recorded natively on linux/arm64 (a golang:1.27
  # container on an arm64 Mac) and darwin/arm64; linux/amd64 could not be recorded
  # natively (Go under amd64 emulation on that machine crashes), so the gate runs
  # on GitHub's arm64 Linux runner, where its budget was recorded.
  lightness:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every raise in testdata/lightness.json's history needs its reason
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The exact toolchain go.mod names: a binary's size is a fact about one
      # toolchain, and setup-go may install a newer patch release.
      - name: Lightness budget (linux/arm64)
        run: GOTOOLCHAIN="$(awk '/^toolchain/ {print $2}' go.mod)" scripts/lightness.sh
