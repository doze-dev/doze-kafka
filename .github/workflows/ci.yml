name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      # The release ships a Windows archive. Vet compiles the tests too, so this
      # is the whole tree, and it is what catches a dependency that stopped
      # building there (as doze-names did) before a tag does.
      - name: go vet (windows, cross-compiled)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: build the binary
        run: go build ./cmd/doze-kafka

  test:
    strategy:
      fail-fast: false
      matrix:
        # Both OSes: the fsync path differs (macOS uses F_FULLFSYNC).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -short ./...
      - name: Integration tests (race)
        run: go test -race ./...
