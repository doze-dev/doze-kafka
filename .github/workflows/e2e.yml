name: E2E

# The console in a real browser. The Go tests reach every handler; only a browser
# proves that the page calls them, and that what it shows is usable (focus, the
# keyboard, live updates, layout at phone width).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        env:
          CI: "1"
        run: bunx playwright test
      # The same suite, route gate included, against a broker started with the second
      # identity: listener on 127.0.0.1:0, a console prefix, a data directory with a
      # space, SASL and TLS (foundation B11).
      - name: Playwright (second identity)
        env:
          CI: "1"
        run: |
          go build -o bin/doze-kafka ./cmd/doze-kafka
          go run ./e2e/identity -bin bin/doze-kafka -- sh -c 'cd e2e && bunx playwright test'
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
