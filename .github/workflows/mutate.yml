name: Mutation

# Do the tests notice when the code is wrong? scripts/mutate changes the code one
# mutant at a time and runs the tests that reach it (a mutant is KILLED only by a
# test that ran and failed; a build or setup failure is never a kill), and the run
# fails on any lived, uncovered, timed-out or setup-failed mutant that
# testdata/mutation.json does not list, and on a listed one that is now killed.
#
# - pull requests: the units whose files the PR changed (`mutate matrix <base>`);
# - weekly and on demand: every unit, each split into the shards `mutate list`
#   shows, one job per shard.
on:
  pull_request:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  units:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-units mode diffs against the PR's base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            matrix="$(go run ./scripts/mutate matrix "$BASE")"
          else
            matrix="$(go run ./scripts/mutate matrix)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  mutate:
    needs: units
    if: needs.units.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.units.outputs.matrix) }}
    runs-on: ubuntu-latest
    # The slowest shard measured on a loaded 10-core Mac with 4 workers is under
    # 25 minutes (plan/evidence/mutation-survivors.md has every unit's time); a
    # 2-core runner takes about twice as long.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Mutation check ${{ matrix.unit }} (shard ${{ matrix.shard }})
        run: go run ./scripts/mutate check -shard "${{ matrix.shard }}" "${{ matrix.unit }}"
