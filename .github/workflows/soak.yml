name: Soak

# Weekly (and on demand) sustained-load runs against the real binary: a leak run and
# a chaos run (SIGKILL/SIGTERM restarts under load, asserting no acknowledged record
# is lost). Kept off the PR path because it takes minutes.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration per mode (e.g. 10m, 1h)"
        default: "10m"

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        mode:
          - { name: leak, chaos: "0" }
          - { name: chaos, chaos: "1" }
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: ${{ matrix.mode.name }} soak
        env:
          SOAK_CHAOS: ${{ matrix.mode.chaos }}
          # The binary under the race detector: a leak run is the longest sustained
          # load the suite has, and the best chance of the interleaving that finds one.
          SOAK_RACE: "1"
          SOAK_DURATION: ${{ github.event.inputs.duration || '10m' }}
        run: go test -run TestSoak -timeout 35m -v ./internal/broker/

  # A scheduled run nobody is watching fails silently: the fuzz job was red for
  # eleven consecutive weeks before anyone looked. Open (or comment on) one issue
  # per workflow so a failure shows up where people already look.
  notify:
    needs: soak
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled soak run is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The scheduled run failed: $RUN_URL"$'\n\n'"This issue is updated on each failure and can be closed once the workflow is green."
          fi
