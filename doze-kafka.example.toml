# doze-kafka configuration — copy this to `doze-kafka.toml` in your working
# directory and it is picked up automatically (or point at it with --config).
#
# Every key has the same name as its command-line flag, except the two tables at
# the end: [credentials] is --sasl-user and [tls] is --tls-cert / --tls-key.
# Precedence is flags > file > defaults: this file overlays only the keys it
# names, and any flag still wins for a one-off override. All keys below are
# optional and shown with their defaults — delete the ones you don't need.
#
# Tip: `doze-kafka config print` writes your *effective* config (defaults + this
# file + flags) as TOML, so you can see exactly what the broker will run with.

# Kafka major version to emulate (1-4). 4 enables KIP-848 consumer groups.
kafka-version = 4

# --- network -------------------------------------------------------------------

# The instance is its name: kafka.<name>.doze, on its own loopback address, port 9092.
# The name defaults to this directory's name; one instance per project, all on 9092.
# name = "harbour"
# --listen REPLACES the name (no .doze name is claimed). It is for a case a name cannot
# serve, such as a sibling container reaching this one. ":9092" accepts other machines.
# listen = "127.0.0.1:9092"
# advertised-host = "localhost" # host returned to clients in Metadata. Unset, it is the name, or under listen the address itself ("127.0.0.1"), or "localhost" on every interface.
advertised-port = 0       # port advertised to clients; 0 = the port actually bound.

# --- storage -------------------------------------------------------------------

data-dir = "./data"       # directory holding per-partition log segments.
# meta-db = "./data/meta.db" # metadata database (topics, offsets, producer IDs); defaults to <data-dir>/meta.db.
segment-bytes = 134217728 # roll the active segment past this size (128 MiB).
index-interval-bytes = 4096 # one sparse index entry per this many bytes of log.

# --- retention (delete-only; 0 disables the bound) -----------------------------

retention-bytes = 0       # delete old segments once a partition exceeds this size.
retention-ms = 0          # delete segments older than this many milliseconds.

# --- durability ----------------------------------------------------------------

# Coarse fsync cadence for active segments (0 disables). acks=all always fsyncs
# before acknowledging regardless of this setting.
fsync-interval = "500ms"

# --- consumer groups -----------------------------------------------------------

# KIP-848 group session timeout: evict a member after this long without a heartbeat.
consumer-session-timeout = "45s"

# --- topics --------------------------------------------------------------------

auto-create-topics = true # create unknown topics on first reference.
default-partitions = 1    # partition count for auto-created topics.
max-partitions = 1000     # most partitions one topic may have; each is a directory and open files.

# --- console -------------------------------------------------------------------

console = true                   # serve the web console.
# console-addr = "127.0.0.1:9093" # unset: beside the broker on the name's address (9093), or 127.0.0.1:9093 under listen.
# console-allow-host = ["devbox.lan"] # extra Host names the console answers to.
# trace-header = "x-request-id"         # a record header holding a trace id; the console follows it beside traceparent and B3.

client-telemetry = true                 # accept the metrics clients push about themselves (KIP-714); the console shows them.
zone = true                              # join the shared .doze zone (names and the console front door); false is the same as DOZE_ZONE=off.

# --- schema registry ----------------------------------------------------------

schema-registry = true                  # serve the built-in Confluent-compatible schema registry.
# schema-registry-addr = "127.0.0.1:8081" # unset: beside the broker on the name's address (8081), or 127.0.0.1:8081 under listen.

# --- process -------------------------------------------------------------------

log-level = "info"               # debug (logs every request), info, warn or error.
log-format = "text"              # text or json.
# pprof-addr = "127.0.0.1:6060"  # serve net/http/pprof here.

# --- auth (all optional) -------------------------------------------------------
#
# These come last on purpose. In TOML every key after a [table] header belongs to
# that table, so a table uncommented in the middle of the file would swallow the
# settings below it ("credentials.console = true" is not a setting).

# Enable SASL by listing mechanisms; supported: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512.
# sasl-mechanisms = ["SCRAM-SHA-256"]

# ACLs created through the Kafka API are enforced. A resource nobody wrote an ACL
# for follows acl-default: "allow" (the default) or "deny" (Kafka's own default).
# Super users are never refused; name one before choosing "deny".
# acl-default = "allow"
# acl-super-user = ["User:admin"]

# SASL users as username = "password". Required when sasl-mechanisms is set.
# Keeping credentials here (rather than on the command line) keeps them out of
# your shell history and the process's argument list.
# [credentials]
# alice = "s3cret"
# bob   = "hunter2"

# TLS encrypts the listener. Both cert and key are required together, and the
# files must exist. TLS and SASL are independent — use either, both, or neither.
# [tls]
# cert = "./certs/server.pem"
# key  = "./certs/server-key.pem"
